; DockerGo — LILYGO T-Dongle-S3 (ESP32-S3) firmware
; PlatformIO project configuration
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = t-dongle-s3

[env:t-dongle-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- 16 MB flash, no OTA-heavy layout needed (images live on SD, not flash) ---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Base T-Dongle-S3 has no OPI PSRAM. If your board is the PSRAM variant,
; change this to `qio_opi` and add `-D BOARD_HAS_PSRAM`.
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; --- USB serial (T-Dongle-S3 enumerates as native USB CDC) ---
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI configuration for the 0.96" ST7735 80x160 panel ---
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_GREENTAB160x80=1
    -D TFT_WIDTH=80
    -D TFT_HEIGHT=160
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MOSI=3
    -D TFT_SCLK=5
    -D TFT_CS=4
    -D TFT_DC=2
    -D TFT_RST=1
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    ; --- App options ---
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
